name: BT-01B conectores de fuentes publicas
on:
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: buscar-curro-public-collectors
  cancel-in-progress: false

jobs:
  public-connectors:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Pruebas sin red y regresión ATE
        run: >-
          python3 -m unittest -v
          test_employment_core.py
          test_public_connectors.py
          test_source_viability.py
          test_ate_public.py
      - name: Restaurar estado validado de la ejecución anterior
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: >-
          python3 restore_previous_state.py
          --workflow bt01b-public-sources.yml
          --artifact-name bt01b-state
          --destination data/public-source-state.json
      - name: Ejecutar conectores públicos
        run: >-
          python3 run_public_sources.py
          --state data/public-source-state.json
          --output-dir bt01b-output
      - name: Resumen en la ejecución
        if: always()
        run: cat bt01b-output/report.md >> "$GITHUB_STEP_SUMMARY"
      - name: Estado para la siguiente ejecución
        if: success()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: bt01b-state
          path: |
            bt01b-output/
            !bt01b-output/state.jsonstate.json
          if-no-files-found: error
          retention-days: 30
      - name: Evidencia BT-01B
        if: success()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: bt01b-public-source-results
          path: |
            bt01b-output/
            !bt01b-output/state.json
          if-no-files-found: error
          retention-days: 7
