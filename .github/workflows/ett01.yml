name: ETT-01 fuentes publicas y estado persistente
on:
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: buscar-curro-public-collectors
  cancel-in-progress: false

jobs:
  ett-connectors:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Pruebas unitarias y regresiones existentes
        run: python3 -m unittest -v
      - name: Restaurar estado validado de la ejecución anterior
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: >-
          python3 restore_previous_state.py
          --workflow ett01.yml
          --artifact-name ett01-state
          --destination data/ett-state.json
      - name: Diagnosticar y ejecutar conectores ETT públicos
        run: python3 run_ett_sources.py --state data/ett-state.json --output-dir ett01-output
      - name: Resumen ETT-01
        if: always()
        run: cat ett01-output/report.md >> "$GITHUB_STEP_SUMMARY"
      - name: Estado para la siguiente ejecución
        if: success()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ett01-state
          path: |
            ett01-output/
            !ett01-output/state.jsonstate.json
          if-no-files-found: error
          retention-days: 30
      - name: Evidencia ETT-01
        if: success()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ett01-results
          path: |
            ett01-output/
            !ett01-output/state.json
          if-no-files-found: error
          retention-days: 7
