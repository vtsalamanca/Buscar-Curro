name: Verificar fuente publica ATE Toledo
on:
  workflow_dispatch:
  push:
    paths:
      - ate_public.py
      - test_ate_public.py
      - .github/workflows/ate-public.yml
permissions:
  contents: read
jobs:
  public-source:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Pruebas del extractor
        run: python3 -m unittest -v test_ate_public.py
      - name: Verificar pagina y PDF de Toledo
        run: python3 ate_public.py
