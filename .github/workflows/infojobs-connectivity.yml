name: Diagnóstico público InfoJobs sin credenciales
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  public-probe:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: python3 infojobs_connectivity.py
