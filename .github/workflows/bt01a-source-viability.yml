name: BT-01A viabilidad de fuentes publicas
on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: bt01a-source-viability
  cancel-in-progress: false

jobs:
  public-source-viability:
    runs-on: ubuntu-latest
    timeout-minutes: 7
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Pruebas sin red
        run: python3 -m unittest -v test_source_viability.py test_ate_public.py
      - name: Diagnostico publico acotado
        run: python3 source_viability.py --environment github-actions --output-dir bt01a-output
      - name: Resumen en la ejecucion
        if: always()
        run: cat bt01a-output/bt01a-report.md >> "$GITHUB_STEP_SUMMARY"
      - name: Evidencia BT-01A
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: bt01a-public-source-viability
          path: bt01a-output/
          if-no-files-found: error
          retention-days: 7
